# CANDIDATE standalone per-host Nginx proxy, NOT the enterprise HA LB itself.
# Duplicate on host B with its own private IPs/certificate. Documentation-only
# addresses below MUST be replaced by administrator-reviewed values before use.
# HA LB terminates native-client TLS, then verifies TLS and uses its own mTLS
# identity to these host proxies. Native clients do NOT require mTLS.
worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/freebusy-error.log crit;
    client_max_body_size 256k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 5s;
    large_client_header_buffers 2 8k;
    send_timeout 10s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/freebusy-proxy/tls/host-chain.pem;
    ssl_certificate_key /etc/freebusy-proxy/tls/host-key.pem;
    ssl_client_certificate /etc/freebusy-proxy/tls/approved-lb-monitor-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host localhost;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 1s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_ignore_client_abort off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;

    # Microsoft-facing LB pool: host-A:8443 and host-B:8443, never private pool.
    server {
        listen 192.0.2.10:8443 ssl;
        server_name gateway-a.example.invalid;
        allow 192.0.2.20;
        allow 192.0.2.21;
        deny all;
        location = /EWS/Exchange.asmx {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        location = /autodiscover/autodiscover.xml {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        location / { return 404; }
    }

    # Zimbra-only private LB pool: host-A:8444 and host-B:8444.
    server {
        listen 198.51.100.10:8444 ssl;
        server_name gateway-a-private.example.invalid;
        allow 198.51.100.20;
        allow 198.51.100.21;
        deny all;
        location = /EWS/Exchange.asmx {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8081;
        }
        location / { return 404; }
    }

    # Separate management VLAN address; NEVER a user-facing LB pool or route.
    server {
        listen 203.0.113.10:9443 ssl;
        server_name gateway-a-mgmt.example.invalid;
        location = /readyz {
            allow 203.0.113.20;
            allow 203.0.113.21;
            deny all;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        location = /healthz {
            allow 203.0.113.30;
            deny all;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        location = /metrics {
            allow 203.0.113.30;
            deny all;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }
        location / { return 404; }
    }
}
